name: bid
# 应用机 230（16C/32G，客户验证环境）。构建上下文 .. = 仓库根(~/bid/app)。数据层在 231。
#
# 资源限额：此前一个都没设——任何容器都能吃光 16 核 32G，实测 bge-embed 一个就占 7.24 GiB。
# agent 是长任务进程，被别的容器抢走 CPU 时症状表现成"模型变慢"，极难归因（本仓栽过一次）。
services:
  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: bid-api:${TAG}
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "4", memory: 4G } } }   # Bun 单进程 + 连接池
    env_file: [.env.deploy.local]
    environment:
      AGENT_BASE_URL: "http://agent-api:8090"
    expose: ["8080"]
    depends_on: [agent-api]

  agent-api:
    build: { context: .., dockerfile: services/agent/Dockerfile }
    image: bid-agent:${TAG}
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }   # 只做接单与中转，重活在 worker
    env_file: [.env.deploy.local]
    expose: ["8090"]

  # 审查步会把线下标书的扫描页送 231 的 OCR 识别（OCR_BASE_URL，与 api 同一个地址，
  # 经 .env.deploy.local 注入；留空即整段跳过）。**别改成 environment: "${OCR_BASE_URL}" 透传**：
  # environment 覆盖 env_file，一旦 compose 少带 --env-file 就会插成空串把 OCR 静默关掉
  # （同一个坑见 deploy-cust.sh 里数据机那段的注释）。
  agent-worker:
    image: bid-agent:${TAG}
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "8", memory: 8G } } }   # 跑工作流：并行读标 6 路 + 正文，CPU/内存大头
    env_file: [.env.deploy.local]
    command: ["uv", "run", "python", "-m", "agent.main_worker"]
    depends_on: [agent-api]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL}" }
    image: bid-web:${TAG}
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }   # Next 服务端渲染
    expose: ["3000"]

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args: { NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL}" }
    image: bid-admin:${TAG}
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }   # 同 web，访问量更低
    expose: ["3001"]

  # BGE-M3 嵌入服务 2026-08-10 迁至数据机（deploy/data/docker-compose.data.yml）：
  # 与 OCR 同机=本地推理归数据机，卸掉应用机 ~7.2G 常驻内存。
  # agent 经 RAG_EMBED_ENDPOINT（.env.deploy.local）指向数据机 LAN 地址。

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web, admin]
    ports: ["80:80", "443:443", "8081:8081"]
    volumes:
      - ./nginx-ip:/etc/nginx/conf.d:ro
      # 证书目录在发版同步树之外（~/bid/certs），私钥既不进仓库也不被 git archive 覆盖
      - ../../certs:/etc/nginx/certs:ro

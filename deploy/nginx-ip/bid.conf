# 客户验证环境（230）· 2026-08-18 起以备案域名为正式入口。
# :443  → C 端用户前端 · HTTPS（www.zhiqiyuan.cn，WoTrus 证书）——**正式入口**
# :80   → 按 Host 分流（见下），公网 117.131.84.2:18080 映射到此
# :8081 → 运营后台（/admin-api 同源代理给 App API），仍是明文 HTTP
# 前端构建时 NEXT_PUBLIC_API_BASE_URL 为空 = 同源相对路径，故 IP/域名两个入口同一份构建通吃。
#
# :80 为什么要按 Host 分流、而不是一律 301 到域名：
#   **hairpin NAT 不通**（2026-08-18 实测：230 自己 curl https://www.zhiqiyuan.cn 超时）。
#   内网 192.168.106.x 的用户只能直连 230，把他们 301 到公网域名 = 送去一个打不开的地址。
#   所以只有「Host 是域名或公网 IP」的请求才跳 https，内网直连原样服务。
server_tokens off;   # 不外泄 nginx 版本（安全测试报告项）

# 用域名走了 http：升级到 https
server {
  listen 80;
  server_name www.zhiqiyuan.cn zhiqiyuan.cn;
  return 301 https://www.zhiqiyuan.cn$request_uri;
}

# 公网 IP 老入口（http://117.131.84.2:18080/…）：把旧书签迁到域名。
# nginx 匹配 server_name 时忽略 Host 里的端口，故 18080 的请求命中这里。
server {
  listen 80;
  server_name 117.131.84.2;
  return 301 https://www.zhiqiyuan.cn$request_uri;   # 保留路径与查询串（?autostart 等不能丢）
}

# 其余（内网直连 http://192.168.106.230/）：hairpin 不通，绝不能跳域名，原样服务
server {
  listen 80 default_server;
  server_name _;
  include /etc/nginx/conf.d/_site.inc;
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name www.zhiqiyuan.cn zhiqiyuan.cn;
  include /etc/nginx/conf.d/_tls.inc;
  include /etc/nginx/conf.d/_site.inc;
}

server {
  listen 8081;
  server_name _;
  include /etc/nginx/conf.d/_admin.inc;
}

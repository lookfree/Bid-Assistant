# 客户验证环境（230）· 纯 IP 访问，无域名。
# :80   → C 端用户前端（/api /auth 同源代理给 App API）
# :8081 → 运营后台（/admin-api 同源代理给 App API）
# 前端构建时 NEXT_PUBLIC_API_BASE_URL 为空 = 同源相对路径，故无需域名。
# HTTPS：2026-07-28 试装过自签证书后按产品决定撤回（纯 IP 只能自签，浏览器整页警告；
# 且公网 18080 只映射到 :80，走 HTTPS 还需新端口映射）。要再上时见 deploy/gen-selfsigned-cert.sh
# 与备份 bid.conf.bak-*（含 443/8443 server 块与 _tls.inc 写法）。
server_tokens off;   # 不外泄 nginx 版本（安全测试报告项）

server {
  listen 80 default_server;
  server_name _;
  include /etc/nginx/conf.d/_site.inc;
}

server {
  listen 8081;
  server_name _;
  include /etc/nginx/conf.d/_admin.inc;
}

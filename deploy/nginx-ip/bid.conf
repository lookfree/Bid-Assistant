# 客户验证环境（230）· IP 与域名双入口。
# :80   → C 端用户前端（公网 117.131.84.2:18080 映射到此，过渡入口）
# :443  → C 端用户前端 · HTTPS（域名 www.zhiqiyuan.cn，2026-08-18 备案域名 + WoTrus 证书就位）
# :8081 → 运营后台（/admin-api 同源代理给 App API）
# 前端构建时 NEXT_PUBLIC_API_BASE_URL 为空 = 同源相对路径，故 IP/域名两个入口同一份构建通吃。
#
# :80 **刻意不做 301 跳 443**：18080→:80 是当前唯一在用的入口，一旦跳转，域名 443 若还没打通
# 就把现有访问全部打死。等 https 实测通、用户改用域名之后再补跳转与 HSTS（见 _tls.inc 末尾）。
server_tokens off;   # 不外泄 nginx 版本（安全测试报告项）

server {
  listen 80 default_server;
  server_name _;
  include /etc/nginx/conf.d/_site.inc;
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name www.zhiqiyuan.cn zhiqiyuan.cn;
  include /etc/nginx/conf.d/_tls.inc;
  include /etc/nginx/conf.d/_site.inc;
}

server {
  listen 8081;
  server_name _;
  include /etc/nginx/conf.d/_admin.inc;
}
